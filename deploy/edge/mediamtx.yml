# MediaMTX: re-streams the SIYI camera's RTSP feed to browsers.
# Put it behind the same TLS reverse proxy as the platform (https://edge.example.com).
logLevel: info

rtsp: no
rtmp: no
srt: no
hls: yes
hlsAddress: :8888
webrtc: yes
webrtcAddress: :8889

# Every viewer is checked by the platform: the browser gets a short-lived signed token from
# POST /api/v1/media/{deviceId}/session, and MediaMTX asks the platform whether it is valid.
authMethod: http
authHTTPAddress: https://platform.example.com/api/v1/media/auth
authHTTPExclude:
  - action: api
  - action: metrics

# Streams are pulled from the camera only while someone is watching (sourceOnDemand), and the
# browser drops its stream when the view is hidden, so an idle console uses no link bandwidth.
pathDefaults:
  rtspTransport: tcp
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s

paths:
  cam-zt30-01:
    # Main stream (full resolution). SIYI default: rtsp://192.168.144.25:8554/main.264
    # (check your model's manual; IP and path can differ by model and firmware).
    source: rtsp://192.168.144.25:8554/main.264
  cam-zt30-01-sub:
    # Low-resolution sub-stream for the console's small view and slow links. Not every SIYI
    # model/firmware has one; remove this path and "whepSub" from site.json if yours does not.
    source: rtsp://192.168.144.25:8554/sub.264
