# Edge site stack: runs on a mini PC wired to the SIYI UniRC 7 Pro's LAN port
# (same 192.168.144.x network as the air unit, flight controller and camera).
#   cp ../../apps/gateway/config/siyi-site.example.json site.json   # then edit
#   docker compose up -d
services:
  edge-gateway:
    image: ps-twin:latest # built from the repo Dockerfile
    command: ['node', 'apps/gateway/dist/index.js']
    network_mode: host # reach 192.168.144.20 (UniRC datalink) and .25 (camera)
    environment:
      GATEWAY_CONFIG: /config/site.json
      GATEWAY_DATA_DIR: /data/gateway # command ledgers (docs/ADAPTER_CONTRACT.md §7)
    volumes:
      - ./site.json:/config/site.json:ro
      # Named volume, so the ledgers survive restarts and container re-creates. Not a bind mount:
      # a new named volume takes the image's /data ownership (node), a missing host dir is created root-owned.
      - gateway-data:/data
    restart: unless-stopped

  media:
    image: bluenviron/mediamtx:1.9.3 # RTSP from the camera → WebRTC (WHEP) / HLS for browsers
    network_mode: host
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings # recorded video (size it for recordDeleteAfter × bitrate × cameras)
    restart: unless-stopped

volumes:
  gateway-data: # keep it: `docker compose down -v` deletes the ledgers
